spring.application.name=evconnect-backend
server.port=${PORT:8080}

# Primary Datasource Configuration (PostgreSQL by default when SPRING_DATASOURCE_URL is set, H2 PostgreSQL mode as local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:evdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Enable scheduling for simulator
spring.task.scheduling.pool.size=2

# CORS configuration
management.endpoints.web.exposure.include=*
